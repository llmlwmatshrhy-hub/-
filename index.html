<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d1233" />
<title>رسالة لريم 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --night:#0d1233;
    --night2:#1c1a52;
    --moon:#eef0fb;
    --ink:#232a5c;
    --rose:#d9456f;
    --rose-dark:#9c2150;
    --gold:#f2d48b;
    --display:"Aref Ruqaa","Amiri",serif;
    --body:"Amiri","Noto Naskh Arabic",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--night);overflow:hidden}
  body{
    font-family:var(--body);color:var(--moon);
    background:
      radial-gradient(120% 70% at 85% -10%, #3a2f86 0%, transparent 55%),
      radial-gradient(90% 60% at 0% 100%, #4b1f55 0%, transparent 55%),
      linear-gradient(180deg,var(--night2),var(--night));
  }
  button{font-family:inherit}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  /* ---------- sky ---------- */
  #sky{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;border-radius:50%;background:var(--gold);animation:tw var(--t) ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.15}to{opacity:.95}}
  .moon{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 28px);left:24px;width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fffbe8,#f2d48b 70%);
    box-shadow:0 0 40px 8px rgba(242,212,139,.35);z-index:0;pointer-events:none
  }
  .moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--night2);transform:translate(14px,-6px) scale(.86);opacity:.0}
  .float{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:rise var(--d) linear forwards;font-size:var(--s);color:var(--rose);opacity:0}
  @keyframes rise{
    10%{opacity:.8}
    100%{transform:translate(var(--x),-110vh) rotate(var(--r));opacity:0}
  }
  .spark{position:fixed;z-index:80;pointer-events:none;font-size:22px;animation:pop 1.3s ease-out forwards}
  @keyframes pop{
    0%{transform:translate(0,0) scale(.2);opacity:0}
    15%{opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) rotate(120deg) scale(1.1);opacity:0}
  }

  /* ---------- screens ---------- */
  .screen{
    position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);
    transition:opacity .8s ease,transform .8s ease;
  }
  .screen.hide{opacity:0;pointer-events:none;transform:scale(.96)}
  .screen[hidden]{display:none}

  /* ---------- intro / envelope ---------- */
  .to{font-size:20px;color:#c8cbf0;margin:0}
  .name{
    font-family:var(--display);font-weight:700;font-size:clamp(64px,22vw,110px);line-height:1.1;margin:2px 0 6px;
    color:var(--moon);text-shadow:0 0 40px rgba(217,69,111,.55)
  }
  .date{font-family:var(--display);font-size:24px;color:var(--gold);margin:0 0 10px;letter-spacing:1px}
  .date #dateText{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .from{font-size:18px;color:#c8cbf0;margin:0 0 36px}

  .envelope{position:relative;width:min(84vw,340px);aspect-ratio:3/2;margin:0 auto}
  .env-back{position:absolute;inset:0;border-radius:14px;background:#b83a63;box-shadow:0 30px 60px rgba(0,0,0,.45)}
  .env-letter{
    position:absolute;left:6%;right:6%;top:6%;bottom:6%;border-radius:8px;background:var(--moon);z-index:2;
    transition:transform 1s cubic-bezier(.2,.8,.2,1);
  }
  .env-letter:after{content:"";position:absolute;inset:14px;border-top:2px solid rgba(35,42,92,.18);border-bottom:2px solid rgba(35,42,92,.18)}
  .env-front{
    position:absolute;inset:0;z-index:3;border-radius:14px;background:linear-gradient(160deg,#e0587f,#c4416b);
    clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);
  }
  .env-flap{
    position:absolute;left:0;right:0;top:0;height:56%;z-index:4;transform-origin:top;
    background:linear-gradient(180deg,#f0668d,#d9456f);clip-path:polygon(0 0,100% 0,50% 100%);
    transition:transform .9s cubic-bezier(.3,.7,.2,1),z-index 0s .35s;
  }
  .seal{
    position:absolute;z-index:6;left:50%;top:54%;width:62px;height:62px;margin:-31px -31px 0 0;border:0;padding:0;cursor:pointer;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff8aa8,#c4264f 55%,#7d1238);
    box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.3);
    color:#ffe3ea;font-size:28px;display:grid;place-items:center;animation:beat 1.6s ease-in-out infinite;
  }
  .seal:before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(255,227,234,.55)}
  @keyframes beat{50%{transform:scale(1.1)}}
  .envelope.open .seal{animation:crack .5s ease forwards}
  @keyframes crack{
    30%{transform:scale(1.25) rotate(-8deg)}
    100%{transform:scale(.2) rotate(40deg);opacity:0}
  }
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
  .envelope.rise .env-letter{transform:translateY(-62%)}
  .tap-hint{margin-top:34px;font-size:16px;color:#c8cbf0;transition:opacity .4s}
  .tap-hint.gone{opacity:0}

  /* ---------- reader ---------- */
  #reader{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 16px);opacity:0;transform:translateY(30px)}
  #reader.show{opacity:1;transform:none}
  .paper{
    position:relative;flex:1;min-height:0;width:min(100%,520px);overflow-y:auto;overflow-x:hidden;
    background:var(--moon);color:var(--ink);border-radius:20px;padding:34px 26px 30px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);scroll-behavior:smooth;
    background-image:repeating-linear-gradient(transparent 0 38px, rgba(35,42,92,.07) 38px 39px);
    background-attachment:local;
  }
  .paper::-webkit-scrollbar{width:0}
  .paper h2{font-family:var(--display);font-size:30px;margin:0 0 22px;color:var(--rose-dark)}
  .para{font-size:21px;line-height:2.15;margin:0 0 20px}
  .w{opacity:0;display:inline-block;transform:translateY(6px);animation:wordIn .55s ease forwards;animation-delay:var(--dl)}
  @keyframes wordIn{to{opacity:1;transform:none}}
  .sign{font-family:var(--display);font-size:28px;color:var(--rose-dark);margin:10px 0 0;opacity:0;transition:opacity 1s}
  .sign.show{opacity:1}
  .sign small{display:block;font-family:var(--body);font-size:16px;color:var(--ink);opacity:.7;margin-bottom:4px}

  .finale{display:none;text-align:center;margin-top:26px}
  .finale.show{display:block;animation:wordIn .8s ease forwards}
  .big-heart{
    border:0;background:none;cursor:pointer;font-size:74px;line-height:1;padding:6px;
    filter:drop-shadow(0 8px 14px rgba(217,69,111,.45));animation:beat 1.4s ease-in-out infinite
  }
  .finale-note{margin:6px 0 0;font-size:17px;color:var(--ink);opacity:.75}
  .reply{display:none;margin-top:14px;font-family:var(--display);font-size:25px;line-height:1.8;color:var(--rose-dark)}
  .reply.show{display:block;animation:wordIn .9s ease forwards}

  .bar{width:min(100%,520px);padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:92px}
  .dots{display:flex;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(238,240,251,.25);transition:.4s}
  .dot.on{background:var(--gold);transform:scale(1.35)}
  .next{
    border:0;cursor:pointer;padding:14px 38px;border-radius:999px;font-size:19px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#f0668d,#c4264f);box-shadow:0 12px 30px rgba(217,69,111,.45);
    transition:opacity .3s,transform .2s
  }
  .next:active{transform:scale(.96)}
  .next[disabled]{opacity:.35;box-shadow:none}
  .next.gone{display:none}

  .music{
    position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer;display:none
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div id="sky"></div>
<div class="moon"></div>
<button class="music" id="music" aria-label="موسيقى">🎵</button>

<!-- الشاشة الأولى: المظروف -->
<section class="screen" id="intro">
  <p class="to">رسالة وصلتلك يا</p>
  <h1 class="name" id="toName">ريم</h1>
  <p class="date" id="dateLine"><span id="dateText"></span> <span id="dateEmoji"></span></p>
  <p class="from">من <span id="fromName">ميدو</span> ❤️</p>

  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="env-letter"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <button class="seal" id="seal" aria-label="افتحي الرسالة">♥</button>
  </div>
  <p class="tap-hint" id="tapHint">اضغطي على الختم عشان تفتحيها</p>
</section>

<!-- الشاشة التانية: الرسالة -->
<section class="screen" id="reader" hidden>
  <div class="paper" id="paper">
    <h2 id="greeting"></h2>
    <div id="paras"></div>
    <div class="sign" id="sign"><small id="signSmall"></small><span id="signName"></span></div>
    <div class="finale" id="finale">
      <button class="big-heart" id="bigHeart" aria-label="قلب">❤️</button>
      <p class="finale-note" id="finaleNote"></p>
      <div class="reply" id="reply"></div>
    </div>
  </div>
  <div class="bar">
    <button class="next" id="next">كمّلي ❤️</button>
    <div class="dots" id="dots"></div>
  </div>
</section>

<audio id="audio" loop preload="none"></audio>

<script>
/* =====================================================
   ✏️ عدّل هنا بس — باقي الكود سيبه زي ما هو
   ===================================================== */
const CONFIG = {
  to:   "ريم",
  from: "ميدو",
  tabTitle: "رسالة لريم 💌",

  date: "3/24",          // التاريخ تحت اسمها
  dateEmoji: "🦋",       // الإيموجي جنبه


  greeting: "إلى ريم،",

  // كل عنصر في القايمة = فقرة. هتظهر واحدة واحدة.
  letter: [
    "في 11/11.. وفي كل يوم بيعدي وأنا معاكي، إنتِ أحلى وأجمل نصيب القدر جابهولي.",
    "أنا كل يوم بحبك أكتر من اليوم اللي قبله، وكل دقيقة بتعدي بتخليني أتأكد أكتر إن قلبي اختارك صح من بين كل الناس.",
    "عايزك تعرفي كويس إنك غالية عندي قوي، ومهما الدنيا اتغيرت ومهما الأيام عدت، هيفضل لك في قلبي مكان خاص جداً ومحدش يقرب منه أبداً.",
    "مش عايز من الدنيا دي كلها غير إننا نفضل مع بعض، وإن الأيام الجاية تكون أحلى لينا.. ولو قابلتنا أي ظروف أو حصل بينا أي اختلاف، نكون دايماً متمسكين ببعض وفاهمين بعض، ونختار بعض كل يوم من جديد.",
    "عايز أكون ليكي الشخص اللي تقدري تحكيله من غير ما تخافي من أي حكم أو لوم، والشخص اللي تلاقي عنده دايماً الاهتمام والاحتواء الحقيقي، واللي يفرح لفرحك ويشجعك في كل خطوة بخطوتها.",
    "وعايزك تعرفي إنك تستاهلي كل الحب اللي في الدنيا دي بحالها، وإن وجودك عندي مش حاجة عادية أبداً.. شكراً على كل لحظة حلوة عيشناها، وكل كلمة فرحتيني بيها، وكل ضحكة ضحكتها من قلبي بسببك.",
    "ويارب أشوفك دايماً مبسوطة، مرتاحة، ومحققة كل اللي بتمنيه، وأكون أنا موجود في كل لحظة حلوة في حياتك يا حبيبة قلبي.",
    "عارف إن كلامي ممكن يكون متلخبط شوية ومش عارف أجمع الكلام صح، بس بجد عايزك تفضلي فاكرة إنه مفيش أي رسالة في الدنيا كلها تقدر توصف أنا بحبك قد إيه 🥺🌍✨",
    "وكل 11/11 وأنتِ حبيبتي وبنتي و طزطوزه قلبي وحظي الحلو وأجمل حاجة حصلت في حياتي كلها 🤍🦋🌌"
  ],

  signSmall: "بحبك دايمًا،",
  signName:  "ميدو",

  // القلب الكبير في الآخر (سيب finaleNote فاضي "" لو مش عاوزه)
  finaleNote:  "اضغطي على القلب",
  finaleReply: "بحبك يا ريم ❤️",

  // موسيقى اختيارية: حط ملف mp3 جنب index.html واكتب اسمه هنا، مثال "song.mp3"
  music: ""
};
/* ===================================================== */

const $ = id => document.getElementById(id);

document.title = CONFIG.tabTitle;
$("toName").textContent = CONFIG.to;
$("fromName").textContent = CONFIG.from;
$("dateText").textContent = CONFIG.date;
$("dateEmoji").textContent = CONFIG.dateEmoji;
$("greeting").textContent = CONFIG.greeting;
$("signSmall").textContent = CONFIG.signSmall;
$("signName").textContent = CONFIG.signName;
$("finaleNote").textContent = CONFIG.finaleNote;
$("reply").textContent = CONFIG.finaleReply;

/* ---------- نجوم + قلوب طايرة ---------- */
const sky = $("sky");
for(let i=0;i<70;i++){
  const s = document.createElement("span");
  s.className = "star";
  const size = Math.random()*2.4+.8;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--t:${2+Math.random()*3}s;animation-delay:${-Math.random()*4}s`;
  sky.appendChild(s);
}
function floatHeart(){
  const h = document.createElement("span");
  h.className = "float";
  h.textContent = Math.random() > .3 ? "♡" : "❤";
  h.style.left = Math.random()*100 + "vw";
  h.style.setProperty("--x", (Math.random()*100-50)+"px");
  h.style.setProperty("--r", (Math.random()*80-40)+"deg");
  h.style.setProperty("--d", (8+Math.random()*6)+"s");
  h.style.setProperty("--s", (14+Math.random()*16)+"px");
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),15000);
}
setInterval(floatHeart, 1100);

function burst(x,y,n=22){
  const icons = ["❤️","💗","💕","✨","🌙"];
  for(let i=0;i<n;i++){
    const el = document.createElement("span");
    el.className = "spark";
    el.textContent = icons[Math.floor(Math.random()*icons.length)];
    el.style.left = x+"px"; el.style.top = y+"px";
    el.style.setProperty("--tx",(Math.random()*340-170)+"px");
    el.style.setProperty("--ty",(Math.random()*-300-30)+"px");
    el.style.animationDelay = (Math.random()*.2)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1800);
  }
}

/* ---------- فتح المظروف ---------- */
const envelope = $("envelope"), intro = $("intro"), reader = $("reader");
let opened = false;
$("seal").addEventListener("click", e => {
  if(opened) return;
  opened = true;
  $("tapHint").classList.add("gone");
  burst(e.clientX, e.clientY, 18);
  envelope.classList.add("open");
  setTimeout(()=>envelope.classList.add("rise"), 800);
  setTimeout(()=>{
    intro.classList.add("hide");
    reader.hidden = false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      reader.classList.add("show");
      startReading();
    }));
  }, 2100);
  setTimeout(()=>{ intro.hidden = true; }, 3000);
  playMusic();
});

/* ---------- القراية ---------- */
const paper = $("paper"), parasBox = $("paras"), nextBtn = $("next"), dotsBox = $("dots");
let idx = 0, busy = false;

CONFIG.letter.forEach(()=>{
  const d = document.createElement("span"); d.className = "dot"; dotsBox.appendChild(d);
});

function scrollDown(){ paper.scrollTo({top:paper.scrollHeight, behavior:"smooth"}); }

function showPara(i){
  const text = CONFIG.letter[i];
  const p = document.createElement("p");
  p.className = "para";
  const words = text.split(/\s+/);
  words.forEach((w,k)=>{
    const s = document.createElement("span");
    s.className = "w";
    s.style.setProperty("--dl", (k*0.07)+"s");
    s.textContent = w + " ";
    p.appendChild(s);
  });
  parasBox.appendChild(p);
  dotsBox.children[i].classList.add("on");

  const total = words.length*70 + 600;
  const iv = setInterval(scrollDown, 350);
  setTimeout(()=>clearInterval(iv), total);
  return total;
}

function startReading(){
  idx = 0;
  advance();
}

function advance(){
  if(busy) return;
  busy = true;
  nextBtn.disabled = true;
  const t = showPara(idx);
  idx++;
  setTimeout(()=>{
    busy = false;
    if(idx < CONFIG.letter.length){
      nextBtn.disabled = false;
    }else{
      nextBtn.classList.add("gone");
      finish();
    }
  }, t);
}

function finish(){
  $("sign").classList.add("show");
  setTimeout(()=>{
    if(CONFIG.finaleNote || CONFIG.finaleReply){
      $("finale").classList.add("show");
    }
    scrollDown();
    burst(innerWidth/2, innerHeight*.55, 40);
    for(let i=0;i<14;i++) setTimeout(floatHeart, i*120);
  }, 1100);
}

nextBtn.addEventListener("click", advance);

$("bigHeart").addEventListener("click", e=>{
  burst(e.clientX, e.clientY, 26);
  $("reply").classList.add("show");
  for(let i=0;i<12;i++) setTimeout(floatHeart, i*100);
  setTimeout(scrollDown, 150);
});

/* ---------- موسيقى (اختياري) ---------- */
const audio = $("audio"), musicBtn = $("music");
function playMusic(){
  if(!CONFIG.music) return;
  audio.src = CONFIG.music;
  audio.play().catch(()=>{});
  musicBtn.style.display = "block";
}
musicBtn.addEventListener("click", ()=>{
  if(audio.paused){ audio.play(); musicBtn.textContent = "🎵"; }
  else{ audio.pause(); musicBtn.textContent = "🔇"; }
});
</script>
</body>
</html>
